name: "Reusable Build Workflow"

on:
  workflow_call:
    inputs:
      runner-size:
        description: 'Runner size to use (small/medium/large)'
        required: false
        type: string
        default: 'medium'
      timeout-minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.9'

jobs:
  build:
    name: Build Application
    # Runner mapping based on input size
    runs-on: ${{ inputs.runner-size == 'small' && 'ubuntu-latest' || inputs.runner-size == 'medium' && 'ubuntu-latest' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    env:
      WORKLOAD_TYPE: build
      RUNNER_SIZE: ${{ inputs.runner-size }}

    steps:
      - name: Record job start time
        id: start-time
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        run: |
          # Add your build commands here
          python -m compileall .

      - name: Record job end time and duration
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.start-time.outputs.start_time }}
          DURATION=$((END_TIME - START_TIME))
          echo "Job execution time: ${DURATION} seconds"
          echo "### Job Execution Metrics :stopwatch:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Workload Type:** build" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner Size:** ${{ inputs.runner-size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time:** ${DURATION} seconds" >> $GITHUB_STEP_SUMMARY
          echo "- **Timeout Limit:** ${{ inputs.timeout-minutes }} minutes" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version:** ${{ inputs.python-version }}" >> $GITHUB_STEP_SUMMARY
